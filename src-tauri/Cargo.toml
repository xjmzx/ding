[package]
name = "udash"
version = "0.2.0"
description = "Daemon, weather and calendar dashboard"
authors = ["xjmzx"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "udash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# A second launch focuses the running window instead of opening another.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-OS config and cache folders: the same locations pong used.
dirs = "6"
rrule = "0.14.0"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["time", "process", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
gethostname = "1.1.0"
